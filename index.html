<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050505">
<title>CrowRules Records — Coming January 1, 2031</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Orbitron:wght@500;600;700;800;900&display=swap');

*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;min-height:100%;background:#030303;color:#fff;font-family:Montserrat,Arial,sans-serif;overflow-x:hidden}
body{display:flex;align-items:center;justify-content:center;min-height:100vh}

.page{
  position:relative;width:100%;min-height:100vh;overflow:hidden;
  background:
    radial-gradient(circle at 50% 42%, rgba(255,255,255,.08), transparent 24%),
    radial-gradient(circle at 50% 70%, rgba(120,120,120,.06), transparent 35%),
    #030303;
}

.noise{
  position:absolute;inset:0;opacity:.055;pointer-events:none;z-index:20;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.9'/%3E%3C/svg%3E");
}

.grid{
  position:absolute;inset:0;opacity:.13;
  background-image:linear-gradient(rgba(255,255,255,.055) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(255,255,255,.055) 1px,transparent 1px);
  background-size:55px 55px;
  mask-image:linear-gradient(to bottom,transparent,black 20%,black 75%,transparent);
}

.scan{
  position:absolute;left:0;width:100%;height:2px;background:rgba(255,255,255,.11);
  box-shadow:0 0 18px rgba(255,255,255,.22);animation:scan 7s linear infinite;z-index:5
}
@keyframes scan{from{top:-3%}to{top:103%}}

.crow{
  position:absolute;left:50%;top:39%;width:150px;height:95px;transform:translate(-50%,-50%);
  opacity:0;animation:revealCrow 2.8s .7s ease forwards;filter:drop-shadow(0 0 18px rgba(255,255,255,.22))
}
.crow:before{
  content:"";position:absolute;left:18px;top:34px;width:103px;height:48px;
  background:#0a0a0a;border:2px solid rgba(255,255,255,.25);
  border-radius:55% 48% 45% 52%;transform:rotate(-4deg);
}
.crow:after{
  content:"";position:absolute;right:8px;top:24px;width:42px;height:33px;
  background:#0a0a0a;border:2px solid rgba(255,255,255,.25);
  border-radius:60% 55% 45% 50%;transform:rotate(15deg);
}
.wing{
  position:absolute;left:35px;top:22px;width:72px;height:48px;
  border-left:3px solid rgba(255,255,255,.28);border-radius:50%;
  transform:rotate(-30deg);animation:wing 1.2s ease-in-out infinite alternate
}
.beak{
  position:absolute;right:-8px;top:39px;width:28px;height:10px;
  background:#111;border-top:2px solid rgba(255,255,255,.25);transform:skewX(-25deg)
}
.eye{position:absolute;right:28px;top:34px;width:5px;height:5px;border-radius:50%;background:#fff;box-shadow:0 0 10px #fff}
@keyframes wing{to{transform:rotate(-13deg) translateY(5px)}}
@keyframes revealCrow{
  0%{opacity:0;transform:translate(-50%,-45%) scale(.45)}
  55%{opacity:1}
  100%{opacity:.88;transform:translate(-50%,-50%) scale(1)}
}

.content{
  position:relative;z-index:10;min-height:100vh;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;padding:50px 20px;
}
.eyebrow{
  font-family:Orbitron,sans-serif;font-size:11px;letter-spacing:.42em;text-transform:uppercase;
  color:#aaa;margin-bottom:18px;opacity:0;animation:up .9s 1.8s ease forwards
}
.logo{
  font-family:Orbitron,sans-serif;font-size:clamp(42px,9vw,105px);font-weight:900;
  letter-spacing:.08em;line-height:.95;text-transform:uppercase;
  opacity:0;animation:logoIn 1.3s 1.95s cubic-bezier(.2,.8,.2,1) forwards;
  text-shadow:0 0 22px rgba(255,255,255,.15)
}
.logo span{display:block;font-size:.36em;letter-spacing:.45em;margin-top:18px;color:#a8a8a8}
.rule{width:min(560px,80vw);height:1px;background:linear-gradient(90deg,transparent,#fff,transparent);margin:31px 0 25px;opacity:0;animation:up .9s 2.4s ease forwards}
.tagline{font-size:clamp(13px,2vw,18px);letter-spacing:.2em;text-transform:uppercase;color:#c8c8c8;opacity:0;animation:up .9s 2.55s ease forwards}

.countdown{
  display:grid;grid-template-columns:repeat(4,minmax(65px,110px));gap:12px;
  margin-top:43px;opacity:0;animation:up .9s 2.75s ease forwards
}
.unit{
  border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.025);
  padding:18px 10px 14px;backdrop-filter:blur(8px);
  box-shadow:inset 0 0 20px rgba(255,255,255,.025)
}
.num{font-family:Orbitron,sans-serif;font-size:clamp(25px,5vw,43px);font-weight:700;line-height:1}
.label{font-size:8px;letter-spacing:.3em;text-transform:uppercase;color:#8f8f8f;margin-top:9px}

.status{
  margin-top:34px;font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:#777;
  opacity:0;animation:up .9s 3s ease forwards
}
.status b{color:#ddd;font-weight:600}

.footer{
  position:absolute;bottom:25px;left:0;width:100%;text-align:center;z-index:12;
  font-size:9px;letter-spacing:.24em;text-transform:uppercase;color:#555
}
.corner{position:absolute;width:70px;height:70px;border-color:rgba(255,255,255,.22);z-index:11}
.c1{left:25px;top:25px;border-left:1px solid;border-top:1px solid}
.c2{right:25px;top:25px;border-right:1px solid;border-top:1px solid}
.c3{left:25px;bottom:25px;border-left:1px solid;border-bottom:1px solid}
.c4{right:25px;bottom:25px;border-right:1px solid;border-bottom:1px solid}

@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@keyframes logoIn{from{opacity:0;transform:scale(.86);letter-spacing:.22em;filter:blur(8px)}to{opacity:1;transform:scale(1);letter-spacing:.08em;filter:blur(0)}}

.flash{animation:flash .15s linear}
@keyframes flash{50%{opacity:.55}}

@media(max-width:520px){
  .countdown{gap:7px}
  .unit{padding:15px 5px 12px}
  .logo{letter-spacing:.04em}
  .logo span{letter-spacing:.25em}
}
</style>
</head>
<body>
<div class="page">
  <div class="grid"></div>
  <div class="noise"></div>
  <div class="scan"></div>
  <div class="corner c1"></div><div class="corner c2"></div>
  <div class="corner c3"></div><div class="corner c4"></div>

  <div class="crow" aria-hidden="true">
    <div class="wing"></div><div class="beak"></div><div class="eye"></div>
  </div>

  <main class="content">
    <div class="eyebrow">A CrowRules Entertainment Label</div>
    <h1 class="logo">CrowRules<span>Records</span></h1>
    <div class="rule"></div>
    <p class="tagline">Independent Sound. Original Voices. No Boundaries.</p>

    <section class="countdown" aria-label="Countdown to January 1, 2031">
      <div class="unit"><div class="num" id="days">0000</div><div class="label">Days</div></div>
      <div class="unit"><div class="num" id="hours">00</div><div class="label">Hours</div></div>
      <div class="unit"><div class="num" id="minutes">00</div><div class="label">Minutes</div></div>
      <div class="unit"><div class="num" id="seconds">00</div><div class="label">Seconds</div></div>
    </section>

    <div class="status">Launch Target <b>January 1, 2031</b></div>
  </main>

  <footer class="footer">CrowRules Records © <span id="year"></span> • In Development</footer>
</div>

<script>
const target = new Date("2031-01-01T00:00:00").getTime();

const $ = id => document.getElementById(id);

function pad(n, size=2){
  return String(Math.max(0,n)).padStart(size,"0");
}

function tick(){
  const now = Date.now();
  let diff = Math.max(0, target - now);

  const days = Math.floor(diff / 86400000);
  diff %= 86400000;
  const hours = Math.floor(diff / 3600000);
  diff %= 3600000;
  const minutes = Math.floor(diff / 60000);
  const seconds = Math.floor((diff % 60000) / 1000);

  $("days").textContent = pad(days,4);
  $("hours").textContent = pad(hours);
  $("minutes").textContent = pad(minutes);
  $("seconds").textContent = pad(seconds);

  if(target - now <= 0){
    document.querySelector(".status").innerHTML = "<b>CrowRules Records Has Arrived.</b>";
  }
}
tick();
setInterval(tick,1000);

$("year").textContent = new Date().getFullYear();

setInterval(()=>{
  document.querySelector(".logo").classList.add("flash");
  setTimeout(()=>document.querySelector(".logo").classList.remove("flash"),150);
}, 8500);
</script>
</body>
</html>
